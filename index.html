<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visit RW</title>

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    darkMode: 'class'
  }
</script>
</head>

<body class="bg-white text-black dark:bg-gray-900 dark:text-white scroll-smooth">

<!-- HEADER -->
<header>
  <div class="flex justify-between items-center px-6 py-3">

    <h1 class="font-bold">VISIT RW</h1>

    <nav class="hidden md:flex gap-4">

      <a href="#home" class="dark:text-white">Home</a>
      <a href="#features" class="dark:text-white">Features</a>

      <div class="relative">
        <button id="pagesBtn">Pages ▾</button>

        <ul id="pagesMenu"
            class="hidden absolute bg-white dark:bg-gray-800 shadow-md mt-2 p-2 rounded">

          <li><a class="block px-2 py-1 dark:text-white" href="#">About</a></li>
          <li><a class="block px-2 py-1 dark:text-white" href="#">Gallery</a></li>
          <li><a class="block px-2 py-1 dark:text-white" href="#">Activities</a></li>
          <li><a class="block px-2 py-1 dark:text-white" href="#">Booking</a></li>

        </ul>
      </div>

      <a href="#contact" class="dark:text-white">Contact</a>

    </nav>

    <div class="flex gap-3">
      <button id="toggle-theme">🌙</button>
      <button class="md:hidden">☰</button>
    </div>

  </div>
</header>

<!-- HOME -->
<section id="home"
  class="h-screen flex justify-center items-center text-white bg-cover bg-center"
  style="background-image:url('https://images.unsplash.com/photo-1547471080-7cc2caa01a7e');">

  <div class="bg-black/60 w-full h-full flex flex-col justify-center items-center text-center p-6">

    <h1 id="homeTitle" class="text-4xl font-bold">
      Discover Rwanda with VISIT RW
    </h1>

    <p id="output" class="mt-4 text-green-300"></p>

    <input id="userInput" type="text"
      class="mt-6 p-2 text-black rounded"
      placeholder="Enter destination">

    <button id="changeTextBtn"
      class="bg-blue-600 px-4 py-2 mt-3 rounded">
      Plan Trip
    </button>

  </div>
</section>

<!-- FEATURES -->
<section id="features" class="p-10 text-center">

  <h2 class="text-3xl font-bold mb-6">Explore Rwanda Features</h2>

  <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">

    <!-- CARD 1 -->
    <div class="h-64 bg-cover bg-center text-white flex flex-col justify-end p-4 rounded"
      style="background-image:url('https://images.unsplash.com/photo-1549880338-65ddcdfd017b');">

      <h3 class="font-bold">Volcanoes Park</h3>
      <a href="#" class="explore underline text-blue-200" data-place="volcanoes">
        Explore more
      </a>
    </div>

    <!-- CARD 2 -->
    <div class="h-64 bg-cover bg-center text-white flex flex-col justify-end p-4 rounded"
      style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');">

      <h3 class="font-bold">Lake Kivu</h3>
      <a href="#" class="explore underline text-blue-200" data-place="kivu">
        Explore more
      </a>
    </div>

    <!-- CARD 3 -->
    <div class="h-64 bg-cover bg-center text-white flex flex-col justify-end p-4 rounded"
      style="background-image:url('https://images.unsplash.com/photo-1528127269322-539801943592');">

      <h3 class="font-bold">Kigali City</h3>
      <a href="#" class="explore underline text-blue-200" data-place="kigali">
        Explore more
      </a>
    </div>

    <!-- CARD 4 -->
    <div class="h-64 bg-cover bg-center text-white flex flex-col justify-end p-4 rounded"
      style="background-image:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');">

      <h3 class="font-bold">Nyungwe Forest</h3>
      <a href="#" class="explore underline text-blue-200" data-place="nyungwe">
        Explore more
      </a>
    </div>

  </div>

</section>

<!-- DETAILS DISPLAY -->
<section id="details" class="p-10 text-center"></section>

<!-- SCRIPT -->
<script>

// DARK MODE
const themeBtn = document.getElementById("toggle-theme");

themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark");
  themeBtn.textContent = document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
});

// DROPDOWN
const pagesBtn = document.getElementById("pagesBtn");
const pagesMenu = document.getElementById("pagesMenu");

pagesBtn.addEventListener("click", () => {
  pagesMenu.classList.toggle("hidden");
});

document.addEventListener("click", (e) => {
  if (!pagesBtn.contains(e.target) && !pagesMenu.contains(e.target)) {
    pagesMenu.classList.add("hidden");
  }
});

// HOME INPUT
const btn = document.getElementById("changeTextBtn");
const input = document.getElementById("userInput");
const output = document.getElementById("output");

btn.addEventListener("click", () => {
  if (input.value.trim() !== "") {
    output.textContent = "Destination: " + input.value;
  } else {
    alert("Please enter a destination");
  }
});

// FEATURES DATA
const details = document.getElementById("details");

const data = {
  volcanoes: {
    title: "Volcanoes National Park",
    text: "Home of mountain gorillas in Rwanda.",
    images: [
      "https://images.unsplash.com/photo-1549880338-65ddcdfd017b",
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
    ]
  },

  kivu: {
    title: "Lake Kivu",
    text: "Beautiful lake in western Rwanda.",
    images: [
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
    ]
  },

  kigali: {
    title: "Kigali City",
    text: "Clean and modern capital of Rwanda.",
    images: [
      "https://images.unsplash.com/photo-1528127269322-539801943592",
      "https://images.unsplash.com/photo-1551632811-561732d1e306"
    ]
  },

  nyungwe: {
    title: "Nyungwe Forest",
    text: "Oldest rainforest in Africa.",
    images: [
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470",
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
    ]
  }
};

// EXPLORE MORE CLICK
document.querySelectorAll(".explore").forEach(link => {
  link.addEventListener("click", function(e) {
    e.preventDefault();

    const place = this.dataset.place;
    const item = data[place];

    details.innerHTML = `
      <h2 class="text-3xl font-bold mb-4">${item.title}</h2>
      <p class="mb-4">${item.text}</p>

      <div class="grid md:grid-cols-2 gap-4">
        <img src="${item.images[0]}" class="rounded">
        <img src="${item.images[1]}" class="rounded">
      </div>
    `;

    details.scrollIntoView({ behavior: "smooth" });
  });
});

</script>

</body>
</html>
