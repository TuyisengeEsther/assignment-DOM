<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore Rwanda</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>

<body class="bg-white text-black dark:bg-gray-900 dark:text-white">

  

  <header class="bg-slate-900 text-white sticky top-0 z-50">

    <nav class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto relative">

      
      <h1 class="text-2xl font-bold">
        Explore Rwanda
      </h1>

    

      <ul id="navLinks"
          class="hidden md:flex gap-6 items-center font-medium">

        <li>
          <a href="#home"
             class="nav-link bg-blue-600 px-3 py-2 rounded-lg">
            Home
          </a>
        </li>

        

        <li class="relative">

          <button id="dropdownBtn"
                  class="nav-link px-3 py-2 rounded-lg hover:bg-blue-600">
            Discover ▾
          </button>

          <ul id="dropdownMenu"
              class="hidden absolute top-12 left-0 bg-white text-black dark:bg-gray-800 dark:text-white w-44 rounded-xl shadow-lg overflow-hidden">

            <li>
              <a href="#activities"
                 class="block px-4 py-3 hover:bg-gray-200 dark:hover:bg-gray-700">
                Activities
              </a>
            </li>

            <li>
              <a href="#planner"
                 class="block px-4 py-3 hover:bg-gray-200 dark:hover:bg-gray-700">
                Planner
              </a>
            </li>

            <li>
              <a href="#gallery"
                 class="block px-4 py-3 hover:bg-gray-200 dark:hover:bg-gray-700">
                Gallery
              </a>
            </li>

          </ul>

        </li>

        <li>
          <a href="#activities"
             class="nav-link px-3 py-2 rounded-lg hover:bg-blue-600">
            Activities
          </a>
        </li>

        <li>
          <a href="#planner"
             class="nav-link px-3 py-2 rounded-lg hover:bg-blue-600">
            Planner
          </a>
        </li>

        <li>
          <a href="#contact"
             class="nav-link px-3 py-2 rounded-lg hover:bg-blue-600">
            Contact
          </a>
        </li>

      </ul>

     

      <div class="flex items-center gap-4">

        

        <button id="themeBtn"
                class="bg-blue-600 w-11 h-11 rounded-full text-lg hover:bg-blue-800 transition">
          🌙
        </button>

       

        <button id="hamburger"
                class="md:hidden text-3xl">
          ☰
        </button>

      </div>

    </nav>

   

    <div id="mobileMenu"
         class="hidden md:hidden bg-slate-900 px-6 pb-6">

      <div class="flex flex-col gap-4">

        <a href="#home">Home</a>
        <a href="#activities">Activities</a>
        <a href="#planner">Planner</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>

      </div>

    </div>

  </header>



  <script>

    

    const navLinks =
    document.querySelectorAll(".nav-link");

    navLinks.forEach(function(link) {

      link.addEventListener("click", function() {

        navLinks.forEach(function(item) {

          item.classList.remove("bg-blue-600");

        });

        link.classList.add("bg-blue-600");

      });

    });

   

    const dropdownBtn =
    document.getElementById("dropdownBtn");

    const dropdownMenu =
    document.getElementById("dropdownMenu");

    dropdownBtn.addEventListener("click", function(e) {

      e.preventDefault();

      dropdownMenu.classList.toggle("hidden");

    });

    

    document.addEventListener("click", function(e) {

      if (
        !dropdownBtn.contains(e.target) &&
        !dropdownMenu.contains(e.target)
      ) {

        dropdownMenu.classList.add("hidden");

      }

    });

  

    const hamburger =
    document.getElementById("hamburger");

    const mobileMenu =
    document.getElementById("mobileMenu");

    hamburger.addEventListener("click", function() {

      mobileMenu.classList.toggle("hidden");

    });

    

    const themeBtn =
    document.getElementById("themeBtn");

    themeBtn.addEventListener("click", function() {

      document.documentElement.classList.toggle("dark");

      if (
        document.documentElement.classList.contains("dark")
      ) {

        themeBtn.textContent = "☀️";

      } else {

        themeBtn.textContent = "🌙";

      }

    });

  </script>

</body>
</html>
